{% extends 'store/base.html' %}
{% block content %}
<div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="card shadow-lg border-0 rounded-4 p-4 bg-white">
        
        <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-credit-card text-primary me-2"></i> Secure Checkout</h3>
        
        <div class="bg-light p-3 rounded-3 text-center mb-4 border">
            <h5 class="text-muted mb-1">Amount to Pay (Grand Total)</h5>
            <h2 class="fw-bold text-success mb-0">₹{{ grand_total }}</h2>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="fw-bold text-dark mb-2">Select Payment Method:</label>
                <select name="payment_method" class="form-select form-select-lg border-secondary shadow-sm" required>
                    <option value="" disabled selected>-- Choose Option --</option>
                    <option value="UPI">📱 Pay via UPI (QR Code Scanner)</option>
                    <option value="COD">💵 Cash on Delivery (COD)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm rounded-pill hover-btn">
                Proceed to Pay <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>

    </div>
</div>
{% endblock %}
